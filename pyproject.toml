[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-dungeon-master"
version = "0.1.0"
description = "A local book library and retrieval foundation for an AI Dungeon Master."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "pypdf>=6,<7",
  "fastembed>=0.9.1,<0.10",
  "numpy>=1.26,<3",
  "beautifulsoup4>=4.13,<5",
  "defusedxml>=0.7,<1",
  "filelock>=3.10,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
include = ["dungeon_master*"]

[tool.setuptools.package-data]
dungeon_master = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
